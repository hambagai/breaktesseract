<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            color: #222;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        .container {
            width: 100%;
            max-width: 690px;
            margin: 45px auto;
            padding: 0 20px;
            text-align: left;
        }

        /* 사진 + GIF */
        .images {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .profile-image,
        .gif-image {
            height: 200px;
            width: auto;
            max-width: 48%;
            display: block;
            object-fit: contain;
        }

        /* 글 */
        .section {
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .bold {
            font-weight: bold;
        }

        /* 왼쪽 추가 이미지 */
        .side-image-one {
            position: absolute;
            left: 4%;
            top: 70px;
            width: 116px;
            height: 116px;
            object-fit: cover;
        }

        .side-image-two {
            position: absolute;
            left: 4%;
            top: 190px;
            width: 200px;
            height: 105px;
            object-fit: cover;
        }

        /* 유튜브 팝업 */
        .youtube-popup {
            position: fixed;
            right: 80px;
            bottom: 40px;
            width: 320px;
            max-width: calc(100vw - 32px);
            background: white;
            border: 1px solid #ccc;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 9999;
        }

        .youtube-header {
            height: 25px;
            background: #f5f5f5;
            cursor: move;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 7px;
            user-select: none;
            touch-action: none;
        }

        .youtube-close {
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .youtube-video {
            width: 100%;
            aspect-ratio: 16 / 9;
            display: block;
            border: none;
        }

        /* 갈매기 GIF */
        .seagull-popup {
            position: fixed;
            left: 850px;
            top: 500px;
            width: 220px;
            z-index: 9998;
            cursor: move;
            user-select: none;
            touch-action: none;
        }

        .seagull-popup img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        /* 모바일 화면 */
        @media (max-width: 900px) {

            /* 왼쪽 이미지 숨기기 */
            .side-image-one,
            .side-image-two {
                display: none;
            }
        }

        @media (max-width: 600px) {

            /* 페이지 여백 */
            .container {
                width: 100%;
                margin: 25px auto;
                padding: 0 16px;
            }

            /* 메인 사진과 GIF 크기 */
            .images {
                gap: 8px;
                margin-bottom: 20px;
            }

            .profile-image,
            .gif-image {
                height: 130px;
                max-width: calc((100vw - 48px) / 2);
                width: auto;
                object-fit: contain;
            }

            /* 글씨 */
            body {
                font-size: 13px;
            }

            .section {
                line-height: 1.4;
                margin-bottom: 18px;
            }

            /* 유튜브 팝업 */
            .youtube-popup {
                width: min(280px, calc(100vw - 32px));
                right: 16px;
                bottom: 16px;
            }

            /* 갈매기 */
            .seagull-popup {
                left: 16px;
                top: 220px;
                width: 130px;
            }
        }
    </style>
</head>

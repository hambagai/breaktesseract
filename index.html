<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>자기소개</title>

    <style>
        body {
            margin: 0;
            background-color: white;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 0 20px;
            text-align: center;
        }

        .profile-image {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.8;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 이미지 -->
        <img src="profile.jpg" alt="프로필 이미지" class="profile-image">

        <!-- 자기소개 -->
        <h1>안녕하세요!</h1>

        <p>
            웹툰과 일러스트를 공부하고 있는 ○○○입니다.<br>
            그림과 이야기를 만드는 것을 좋아합니다.<br>
            현재 다양한 창작 작업과 포트폴리오를 준비하고 있습니다.
        </p>

    </div>

</body>
</html>
